<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Fly AI · mini wave</title>
    <style>
        /* ----------------------------
               DARK WAVE · MINI APP STYLE
            ---------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0d10;
            --bg-surface: #14181c;
            --bg-elevated: #1e242b;
            --border-glow: #2a313a;
            --text-primary: #f0f4fa;
            --text-secondary: #a0b3c9;
            --text-muted: #6b7f94;
            --accent: #f6821f;
            --accent-glow: rgba(246, 130, 31, 0.25);
            --user-bubble: #2a323c;
            --assistant-bubble: #1b2229;
            --shadow-heavy: 0 12px 30px rgba(0, 0, 0, 0.8);
            --radius-card: 28px;
            --radius-bubble: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin: 0;
            /* subtle wave texture (pure CSS) */
            background-image: radial-gradient(circle at 20% 30%, rgba(246, 130, 31, 0.03) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(246, 130, 31, 0.04) 0%, transparent 50%);
        }

        /* main card – like a mini wave app */
        .app-card {
            max-width: 480px;
            width: 100%;
            background: var(--bg-surface);
            backdrop-filter: blur(2px);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-heavy), 0 0 0 1px rgba(246, 130, 31, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 94vh;
            max-height: 820px;
            transition: all 0.2s ease;
            border: 1px solid var(--border-glow);
        }

        /* ----- HEADER : mini wave style ----- */
        .app-header {
            padding: 18px 20px 12px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #0b0d10;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .brand-text strong {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: white;
        }

        .brand-text small {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
        }

        .header-badge {
            background: var(--bg-elevated);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        /* ----- CHAT MESSAGES (scroll) ----- */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
            background: var(--bg-primary);
            /* inner wave glow */
            background-image: radial-gradient(circle at 10% 90%, rgba(246, 130, 31, 0.02) 0%, transparent 60%);
        }

        /* hide scrollbar but keep functionality */
        .chat-messages::-webkit-scrollbar {
            width: 3px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-glow);
            border-radius: 20px;
        }

        .message {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: var(--radius-bubble);
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeSlide 0.2s ease-out;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            border: 1px solid transparent;
        }

        .message p {
            margin: 0;
            white-space: pre-line;
        }

        .user-message {
            background: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            border-color: rgba(246, 130, 31, 0.15);
            color: #f0f4fa;
        }

        .assistant-message {
            background: var(--assistant-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border-color: rgba(255, 255, 255, 0.04);
            color: #e3eaf2;
        }

        /* typing indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--assistant-bubble);
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-glow);
            margin: 4px 0 8px;
            backdrop-filter: blur(2px);
            letter-spacing: 0.3px;
        }

        .typing-indicator.visible {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            margin: 0 2px;
            animation: pulseDot 1.4s infinite both;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulseDot {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* ----- INPUT AREA (mini wave) ----- */
        .message-input {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 12px 14px 16px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-glow);
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }

        #user-input {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-primary);
            resize: none;
            min-height: 48px;
            max-height: 120px;
            transition: border 0.15s;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        #user-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow), inset 0 2px 6px rgba(0,0,0,0.6);
        }

        #user-input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 0.9rem;
        }

        #send-button {
            background: var(--accent);
            border: none;
            color: #0b0d10;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0 18px;
            height: 48px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        #send-button:hover {
            background: #ff8c2e;
            transform: scale(1.02);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        #send-button:active {
            transform: scale(0.96);
        }

        #send-button:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            pointer-events: none;
        }

        /* ----- FOOTER (mini) ----- */
        .app-footer {
            padding: 8px 16px 12px;
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.02);
            background: var(--bg-surface);
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }

        .app-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .app-footer a:hover {
            text-decoration: underline;
        }

        /* ----- animations ----- */
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* responsive fine-tune */
        @media (max-width: 480px) {
            .app-card {
                height: 98vh;
                max-height: 780px;
                border-radius: 24px;
            }
            .message {
                font-size: 0.9rem;
                padding: 10px 14px;
                max-width: 92%;
            }
            .brand-text strong {
                font-size: 1rem;
            }
            .header-badge {
                font-size: 0.5rem;
                padding: 2px 10px;
            }
            #user-input {
                font-size: 0.9rem;
                padding: 10px 14px;
                min-height: 44px;
            }
            #send-button {
                height: 44px;
                padding: 0 14px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 380px) {
            .app-header {
                padding: 12px 14px 8px;
                flex-wrap: wrap;
            }
            .brand-icon {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-card" role="main">
        <!-- header : mini wave -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">🌊</div>
                <div class="brand-text">
                    <strong>Fly AI</strong>
                    <small>powered by FlyTripVisa.site</small>
                </div>
            </div>
            <div class="header-badge">⚡ mini wave</div>
        </header>

        <!-- chat messages -->
        <div class="chat-messages" id="chat-messages">
            <div class="message assistant-message">
                <p>👋 Hello! I'm Fly AI.<br>Ask me anything — travel, tech, or just chat.</p>
            </div>
        </div>

        <!-- typing indicator -->
        <div class="typing-indicator" id="typing-indicator">
            <span>Fly AI</span>
            <span class="typing-dots">
                <span></span><span></span><span></span>
            </span>
        </div>

        <!-- input area -->
        <div class="message-input">
            <textarea id="user-input" rows="1" placeholder="Type your message..." autofocus></textarea>
            <button id="send-button">Send</button>
        </div>

        <!-- footer -->
        <div class="app-footer">
            <span>✈️  FlyTripVisa.site  ·  AI wave</span>
        </div>
    </div>

    <!-- chat logic (demo / mock) -->
    <script>
        (function() {
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const typingIndicator = document.getElementById('typing-indicator');

            // helper: add message to chat
            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}-message`;
                const p = document.createElement('p');
                p.textContent = text;
                messageDiv.appendChild(p);
                chatMessages.appendChild(messageDiv);
                // scroll to bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // simulate AI response (with tiny delay)
            function getAIResponse(userText) {
                // a handful of playful replies – mini wave style
                const replies = [
                    "That's a great question! Let me think 🌊",
                    "Interesting! I'd suggest checking FlyTripVisa for travel tips.",
                    "I'm just a wave of AI, but I love chatting with you.",
                    "Did you know? The best travel deals are always on FlyTripVisa.site",
                    "Hmm, let me process that… 🤖",
                    "Absolutely! I'd recommend planning your trip soon.",
                    "I'm here to help — ask me about flights, visas, or anything!",
                    "That reminds me of a beautiful beach in Thailand 🌴",
                    "Fly AI is always learning. Thanks for the chat!",
                    "You're awesome! Keep exploring the world ✈️"
                ];
                // pick a reply based on text length / random
                const idx = Math.min(userText.length, replies.length - 1);
                return replies[idx] || replies[0];
            }

            // simulate sending message
            function handleSend() {
                const text = userInput.value.trim();
                if (!text) return;

                // disable UI
                sendButton.disabled = true;
                userInput.disabled = true;

                // add user message
                addMessage(text, 'user');
                userInput.value = '';
                userInput.style.height = 'auto';

                // show typing indicator
                typingIndicator.classList.add('visible');
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // simulate async AI reply
                const delay = 600 + Math.random() * 800; // 0.6–1.4s
                setTimeout(() => {
                    // hide typing
                    typingIndicator.classList.remove('visible');

                    // get reply
                    const reply = getAIResponse(text);
                    addMessage(reply, 'assistant');

                    // re-enable UI
                    sendButton.disabled = false;
                    userInput.disabled = false;
                    userInput.focus();
                }, delay);
            }

            // event listeners
            sendButton.addEventListener('click', handleSend);

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendButton.disabled) {
                        handleSend();
                    }
                }
            });

            // auto-resize textarea (mini wave)
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            });

            // initial focus
            setTimeout(() => userInput.focus(), 300);

            // extra: click on empty space focuses input
            chatMessages.addEventListener('click', () => userInput.focus());

            // expose for demo (if needed)
            window.__flyAI = { addMessage, handleSend };
        })();
    </script>
</body>
</html>
